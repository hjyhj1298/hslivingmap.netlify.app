<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9f8f2"><title>흥선 보물지도 | 흥선 리빙맵</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./snow.css"></head><body><main><div class="snow" aria-hidden="true"></div><header><div><p class="eyebrow">주민의 기억으로 완성하는 생활지도</p><h1>흥선 보물지도</h1><p>아이콘을 눌러 동네 이야기를 읽고, 직접 다녀온 후기를 남겨보세요.</p></div><span class="clover">☘</span></header><div class="adminBar"><span id="adminStatus"></span><button type="button" id="adminBtn">관리자</button></div><form class="adminLogin" id="adminLogin" hidden><label>관리자 비밀번호<input id="adminPw" type="password" autocomplete="off" required></label><button type="submit">로그인</button><p id="adminErr" class="status alert"></p></form><nav id="categories"></nav><section class="mapWrap"><div class="canvas"><img src="./map.webp" alt="흥선동 일러스트 지도"><div class="markers" id="markers"></div></div></section><section class="legend" id="legend"></section><div class="backdrop" id="backdrop" hidden><aside class="sheet" id="sheet"><button class="close" id="close" type="button" aria-label="닫기">×</button><div class="spotHead" id="spotHead"></div><h3>주민들이 남긴 이야기</h3><blockquote id="opinion"></blockquote><h3>다녀온 사람들의 후기</h3><div id="reviews"></div><p class="status" id="notice" aria-live="polite"></p><button class="primary" id="writeBtn" type="button">여기 다녀왔어요</button><form id="writer" hidden><label>별명<input name="nickname" maxlength="16" required></label><label>한줄 후기<textarea name="comment" maxlength="140" required></textarea></label><label>사진 1~2장<input name="photos" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple></label><label>수정 비밀번호<input name="editPassword" type="password" minlength="4" maxlength="40" required><small>나중에 후기 수정·삭제 시 사용해요.</small></label><p class="status tip" id="geotip">후기 등록 전 현재 위치를 확인합니다.</p><button class="primary" id="submitBtn" type="submit">후기 등록하기</button><p class="privacy">현재 위치는 방문 확인에만 사용하며 공개하지 않아요.</p></form></aside></div></main><script src="./app.js" defer></script></body></html>
